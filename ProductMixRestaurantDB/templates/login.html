{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-5 col-xl-4">
    <div class="card">
      <div class="card-header gradient-header text-center py-3">
        <i class="bi bi-shield-lock-fill me-2"></i>Welcome Back
      </div>
      <div class="card-body">
        <p class="text-muted mb-3">Sign in to continue working with Product Mix and reporting tools.</p>
        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
        <form method="post" class="row g-3">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <div class="col-12">
            <label class="form-label">Email</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
              <input class="form-control" type="email" name="email" placeholder="Email" required>
            </div>
          </div>
          <div class="col-12">
            <label class="form-label">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
              <input class="form-control" type="password" name="password" placeholder="Password" required>
            </div>
          </div>
          <div class="col-12">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="rememberMe">
              <label class="form-check-label" for="rememberMe">Remember me on this device</label>
            </div>
          </div>
          <div class="col-12">
            <button class="btn btn-primary w-100" type="submit">Sign In</button>
          </div>
        </form>
        <div class="alert alert-info mt-3 mb-0 small"><i class="bi bi-info-circle-fill me-1"></i>Keep this account scoped to the correct location before uploads.</div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
