{% extends 'base.html' %}
{% block content %}
<div class="card">
  <div class="card-header gradient-header d-flex justify-content-between align-items-center">
    <span><i class="bi bi-shield-check me-2"></i>Admin Summary</span>
    <span class="small opacity-75">System overview</span>
  </div>
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover table-striped mb-0">
        <thead><tr><th>Metric</th><th>Value</th></tr></thead>
        <tbody>
        {% for k, v in (summary or {}).items() %}
          <tr><td>{{ k.replace('_', ' ').title() }}</td><td>{{ v }}</td></tr>
        {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
