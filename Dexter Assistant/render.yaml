services:
  - type: web
    name: dexter-assistant
    env: python
    buildCommand: pip install -r "Dexter Assistant/requirements_dexter_assistant.txt"
    startCommand: gunicorn --chdir "Dexter Assistant" --workers 1 --threads 8 --timeout 120 --bind 0.0.0.0:$PORT dexter_assistant:app
    domains:
      - dexterassist.com
      - www.dexterassist.com
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.13
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PM_OPEN_BROWSER
        value: "0"
      - key: PM_DEBUG
        value: "0"
