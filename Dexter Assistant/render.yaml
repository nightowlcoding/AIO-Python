services:
  - type: web
    name: dexter-assistant
    env: python
    buildCommand: pip install -r "Dexter Assistant/requirements_dexter_assistant.txt"
    startCommand: gunicorn --chdir "Dexter Assistant" --workers 1 --threads 2 --timeout 120 --bind 0.0.0.0:$PORT dexter_entrypoint:app
    domains:
      - dexterassist.com
      - www.dexterassist.com
    healthCheckPath: /api/health
    disk:
      name: dexter-data
      mountPath: /dexter-data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.13
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PM_OPEN_BROWSER
        value: "0"
      - key: PM_DEBUG
        value: "0"
      - key: IC3_DATA_DIR
        value: /dexter-data/ic3
      - key: PM_DB_DIR
        value: /dexter-data/pm
      - key: DEXTER_AUTH_DATA_DIR
        value: /dexter-data/auth
      - key: DEXTER_MGR_BACKUP_ENABLED
        value: "0"
      - key: DEXTER_MGR_BACKUP_INTERVAL_MINUTES
        value: "15"
      - key: DEXTER_MGR_BACKUP_KEEP_SNAPSHOTS
        value: "192"
      - key: DEXTER_MGR_CRITICAL_BACKUP_TIMES
        value: "00:00,00:30,01:00,01:30,07:00,07:30,08:00,08:30,09:00,09:30,10:00,10:30,11:00,11:30,12:00,12:30,13:00,13:30,14:00,14:30,15:00,15:30,16:00,16:30,17:00,17:30,18:00,18:30,19:00,19:30,20:00,20:30,21:00,21:30,22:00,22:30,23:00,23:30"
      - key: DEXTER_MGR_FULL_BACKUP_TIME
        value: "23:45"
      - key: DEXTER_ALLOW_EPHEMERAL_RBAC
        value: "0"
      - key: DEXTER_NAS_BACKUP_ENABLED
        value: "0"
      - key: DEXTER_NAS_BACKUP_REQUIRED
        value: "0"
      # Set the value in the Render dashboard; used by deploy/backup_production.py.
      - key: DEXTER_OPS_BACKUP_TOKEN
        sync: false
