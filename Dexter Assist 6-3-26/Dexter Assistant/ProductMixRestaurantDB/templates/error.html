{% extends 'base.html' %}
{% block content %}
<div class="card card-danger-soft">
	<div class="card-header card-header-danger-soft">
		<i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error_title or 'Error' }}
	</div>
	<div class="card-body">
		<p class="mb-2">{{ error_message or 'An unexpected error occurred.' }}</p>
		<span class="badge badge-soft-danger">Status {{ status_code }}</span>
		<a class="btn btn-outline-danger ms-2" href="{{ url_for('home') }}"><i class="bi bi-arrow-left me-1"></i>Back to Home</a>
	</div>
</div>
{% endblock %}
