{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6 col-xl-5">
    <div class="card">
      <div class="card-header gradient-header text-center py-3">
        <i class="bi bi-person-plus-fill me-2"></i>Create Account
      </div>
      <div class="card-body">
        <p class="text-muted mb-3">Create a user account for location-based Product Mix operations.</p>
        {% if success %}<div class="alert alert-success">{{ success }}</div>{% endif %}
        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
        <form method="post" class="row g-3">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <div class="col-12">
            <label class="form-label">Full Name</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
              <input class="form-control" type="text" name="full_name" placeholder="Full Name">
            </div>
          </div>
          <div class="col-12">
            <label class="form-label">Email</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
              <input class="form-control" type="email" name="email" placeholder="Email" required>
            </div>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
              <input class="form-control" type="password" name="password" placeholder="Password" required>
            </div>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label">Confirm Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-shield-check"></i></span>
              <input class="form-control" type="password" name="confirm_password" placeholder="Confirm Password" required>
            </div>
          </div>
          <div class="col-12">
            <button class="btn btn-primary w-100" type="submit">Create Account</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
